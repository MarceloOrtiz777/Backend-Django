<div class="card shadow-sm h-100">
    <div class="card-header bg-white fw-bold">Productos con stock bajo</div>
    <ul class="list-group list-group-flush">
        {% for producto in stock_bajo %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            {{ producto.nombre }}
            <span class="badge {% if producto.stock == 0 %}bg-dark{% else %}bg-danger{% endif %}">
                {% if producto.stock == 0 %}Agotado{% else %}{{ producto.stock }} un.{% endif %}
            </span>
        </li>
        {% empty %}
        <li class="list-group-item text-muted">Todos los productos tienen stock suficiente.</li>
        {% endfor %}
    </ul>
</div>
